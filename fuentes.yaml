organismos:
- id: cels
  nombre: CELS
  url_base: https://www.cels.org.ar/feed
  tipo_fuente: organismo
  pais:
  - AR
  prioridad: 1
  verificado: true
  nota: 'Feed confirmado 2026-07-31: 10 entradas, la mas reciente de ayer. Aliado institucional.'
- id: ippdh_mercosur
  nombre: IPPDH Mercosur
  url_base: https://www.ippdh.mercosur.int/feed
  tipo_fuente: organismo
  pais:
  - REGIONAL
  prioridad: 2
  verificado: true
  nota: Confirmado pero con UNA entrada. Señal ocasional, no fuente de flujo.
- id: rpm_chile
  nombre: Red Panamericana de Migraciones
  url_base: null
  tipo_fuente: organismo
  pais:
  - CL
  - REGIONAL
  prioridad: 2
  verificado: false
  nota: Completar URL. Aliado institucional, contacto directo disponible.
cobertura_agregada:
- id: gdelt_volumen_tema
  modo: timelinevol
  prioridad: 1
  verificado: true
  nota: No es fuente de items. Se consulta por tema ya detectado para medir volumen de cobertura y calcular
    el factor de subcobertura del score.
- id: gdelt_migracion_es
  query: migrantes OR migracion sourcelang:spanish
  modo: artlist
  prioridad: 2
  verificado: true
  nota: 'HTTP 429 en dos corridas consecutivas desde Actions: las IPs de los runners son compartidas
    y llegan con el cupo consumido. Requiere reintento con espera, o ejecutarla desde una IP no compartida.'
tendencias_busqueda:
- id: trends_tramites
  biblioteca: pytrends
  geo: AR
  prioridad: 2
  verificado: false
  nota: pytrends se rompe periodicamente por cambios de Google. Aislar y tolerar fallo.
  terminos:
  - radicacion extranjeros
  - DNI extranjero
  - residencia precaria
  - turno migraciones
  - visa humanitaria
  - reunificacion familiar
  - convalidacion de titulo extranjero
  - asilo
social:
- id: bluesky_migracion
  nombre: Bluesky, busqueda publica
  endpoint: https://public.api.bsky.app/xrpc/app.bsky.feed.searchPosts
  prioridad: 2
  verificado: true
  nota: Endpoint publico sin autenticacion. Volumen bajo en castellano pero limpio.
  terminos:
  - migrantes
  - xenofobia
  - deportacion
  - politica migratoria
- id: youtube_migracion
  nombre: YouTube Data API v3
  prioridad: 3
  verificado: false
  nota: 'Requiere API key con cupo gratuito diario. Valor: detectar discurso y desinformacion en formato
    audiovisual, que es donde mas circula.'
- id: corresponsales
  nombre: Red de corresponsales de Refugio
  prioridad: 1
  verificado: false
  nota: 'NO ES UNA API. Entrada humana: un corresponsal reporta una señal desde
    su territorio. Es la fuente con mayor ventaja comparativa del proyecto y la que ninguna plataforma
    puede replicar. Implementar en el modulo de coordinacion.'
