tendencias:
  _nota: "Google Trends es la unica fuente que NO depende de lo que publican los medios.\n\nCUOTA: el\
    \ 2026-08-03 se hicieron ~60 pedidos en una corrida y Google corto en el\nsexto. `related_queries`\
    \ esta bloqueado de entrada; `interest_over_time` responde\npero se degrada. La biblioteca advirtio:\
    \ subir la espera 'antes de que Google\nimplemente un limite de largo plazo'. Por eso ahora se hacen\
    \ POCOS pedidos por\ncorrida, repartidos entre las ocho corridas diarias, en vez de todos juntos.\n\
    \nDOS PREGUNTAS DISTINTAS:\n  1. Que problema local tiene la gente -> terminos de TRAMITE en Argentina,\
    \ fijos.\n     Solo se buscan si hay un problema concreto: una demora, un cambio de requisito.\n\
    \  2. Que lee nuestra audiencia -> termino amplio en los paises donde mas nos leen,\n     rotando\
    \ uno o dos por corrida. Segun Analytics: AR, VE, CL, MX, CO, UY, US, ES.\n     Ojo con la lectura:\
    \ cuando Chile y Colombia devolvieron 'ceuta' y 'marruecos',\n     eso no decia que pasa en Chile,\
    \ sino que estaba leyendo la audiencia chilena.\n     Espana esta en la lista porque es audiencia\
    \ real, no por error."
  activo: true
  solo_en_digest: false
  horas_de_cache: 2
