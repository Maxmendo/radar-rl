  _nota_servicio: 'Consultas de TRAMITE: quien las escribe esta resolviendo un problema, no leyendo

    noticias. Los cinco entran en UNA sola consulta (el tope de Google es 5).

    Son categorias juridicas argentinas. Para sumar otro pais hace falta la lista

    equivalente de ESE pais, no traducir esta. El 2026-08-03 se decidio pedirsela a la

    red de corresponsales en vez de inventarla.'
  semilla_audiencia: migrantes
  geos_audiencia:
  - VE
  - CL
  - MX
  - CO
  - UY
  - US
  - ES
  paises_por_corrida: 1
  _nota_audiencia: 'Argentina SIEMPRE, mas UN pais rotando por corrida. Con 8 corridas diarias, cada

    pais del resto se mide aproximadamente una vez por dia.

    Orden segun Google Analytics de Refugio, de mayor a menor audiencia. Espana entra

    por audiencia, no por alcance editorial.

    COMO LEERLO: cuando Chile y Venezuela devolvieron seis consultas sobre Ceuta, eso

    no decia que pasa alli, sino que estaba leyendo su audiencia. Es atencion de

    nuestros lectores, no realidad local. Para lo local estan los tramites.

    AGRUPACION: las consultas que comparten el tema dominante se juntan en una sola

    linea. Seis variantes de ''ceuta'' ocupaban media pantalla para decir lo mismo.'
  umbrales:
    _nota: Puntaje 0-10 por cuanto sube el interes reciente contra su linea de base.
    ratio_minimo: 1.2
    ratio_maximo: 3.0
    interes_minimo: 15
  max_hechos: 6
  umbral_alerta: 5
