notas_vocabulario:
  version: 2.0 (2026-08-01)
  ejes: '23 ejes en 5 macroareas. Los SUBEJES no son salida del clasificador: son el vocabulario que
    define el alcance de cada eje dentro del prompt. Pedirle a un modelo que elija entre ~120 subejes
    desde un titular de 15 palabras produce ruido; darle esos terminos como definicion mejora la asignacion
    del eje.'
  poblaciones: Solo condicion de VULNERABILIDAD. La condicion juridica (solicitante de asilo, refugiada,
    apatrida, deportada) la cubren los ejes `asilo`, `estatus` y `deportaciones`.
  colectividades: 'Codigos ISO del pais de origen de la comunidad involucrada. Distinta de `poblaciones`:
    es origen nacional, no vulnerabilidad.'
  etapas: Seleccion unica. En que momento del recorrido ocurre el hecho.
  fuera_del_clasificador: 'FORMATOS (noticia, cronica, perfil, podcast) describe lo que Refugio PRODUCE,
    no lo que el radar detecta: desde un titular ajeno no es determinable ni cambia la decision de cubrir.
    ENFOQUES TRANSVERSALES se solapaba con `poblaciones` (ninez_y_adolescencia / ninez, perspectiva_de_genero
    / mujeres). ESCALAS (barrial a internacional) es util y determinable, pero cada dimension extra
    degrada la precision de todas: queda para evaluar mas adelante.'
  desambiguacion:
    biometria: En control fronterizo -> `fronteras`. Como debate tecnologico -> `tecnologia`.
    detencion: TODA detencion de personas migrantes -> `deportaciones`, sea en frontera, en centro de
      detencion o en redada interior.
    desplazamiento: Por persecucion politica -> `exilio`. Por clima -> `movilidad_ambiental`.
    retorno: Voluntario -> `diaspora`. Forzado -> `deportaciones`.
    explotacion: Con red criminal -> `trata`. Sin red -> `trabajo`.
    vigilancia: En frontera -> `fronteras`. Politica de Estado -> `securitizacion`. Debate tecnologico
      -> `tecnologia`.
estados:
  _nota: 'Ciclo de vida de un hecho segun su propagacion. La velocidad se mide en MEDIOS DISTINTOS en
    24h, no en cantidad de notas. Umbrales provisorios: hay que calibrarlos con datos reales de las
    primeras semanas.'
  definiciones:
  - id: top_trend
    nombre: Top trend
    orden: 4
    velocidad_min: 20
    accion: No correrla. Cubrir solo con angulo propio o dato nuevo.
  - id: trending
    nombre: Trending
    orden: 3
    velocidad_min: 8
    velocidad_min_acelerando: 5
    aceleracion_min: 4
    accion: Publicar ya, o buscar el angulo que nadie tomo.
  - id: interes
    nombre: De interes
    orden: 2
    velocidad_min: 3
    velocidad_min_acelerando: 2
    aceleracion_min: 2
    accion: 'EL PUNTO JUSTO. Publicar temprano: si escala, la nota ya esta.'
  - id: nadie_lo_mira
    nombre: Nadie lo mira
    orden: 1
    velocidad_max: 2
    importancia_min: 7
    accion: Investigar. Posible primicia. Requiere reporteria propia.
  - id: ruido
    nombre: Ruido
    orden: 0
    velocidad_max: 2
    importancia_max: 6
    accion: Oculto por defecto. Visible con filtro para auditar el descarte.
  alertas:
    _nota: 'La alerta NO se dispara por puntaje alto sino por ASCENSO de estado. El momento que importa
      es cuando algo importante entra en `interes`: ahi todavia se puede llegar primero.'
    disparar_al_ascender_a:
    - interes
    - trending
    importancia_minima: 7
    max_por_corrida: 3
    no_repetir: Un hecho alerta una sola vez por estado. Registro en datos/alertados.json.
macroareas:
