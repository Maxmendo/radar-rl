notas_vocabulario:
  ejes: '14 activos, agrupados en cuatro familias: politica, proteccion, cotidiano, discurso. Es el
    limite superior que un clasificador maneja bien. Para activar uno de los inactivos, cambiar `activo`
    a true; no requiere tocar codigo.'
  poblaciones: Multiple. Quien esta afectado. Independiente del eje tematico.
  colectividades: 'Multiple, en codigos ISO de pais de origen. NO figura como lista fija: el clasificador
    la completa con la nacionalidad de la comunidad involucrada, ej. [''BO''] para una nota sobre la
    comunidad boliviana. Distinta de `poblaciones`: origen nacional, no condicion de vulnerabilidad.'
  etapas: Seleccion unica. En que momento del recorrido migratorio ocurre el hecho.
  terminologia: 'El eje `estatus` cubre ''migracion irregular'' y ''migracion ilegal'' como TERMINOS
    DE BUSQUEDA, porque mucha cobertura los usa y sin ellos no la veriamos. Pero el vocabulario del
    sistema no reproduce esa categoria: ninguna persona es ilegal. Cuando una nota usa esos terminos,
    el clasificador lo registra en `terminologia_problematica`, que alimenta el eje `medios`.'
