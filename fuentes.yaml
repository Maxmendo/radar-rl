  activo: true
- id: medios
  nombre: Representacion mediatica
  alcance: 'Como la prensa representa a las personas migrantes: encuadres, terminologia, invisibilizacion.'
  familia: discurso
  activo: true
- id: contexto
  nombre: Causas y contexto regional
