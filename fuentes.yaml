# Registro de fuentes del radar migratorio
#
# ALCANCE: America Latina y el Caribe + Estados Unidos.
# Organizado en seis bloques subregionales en vez de pais por pais, para
# mantener el volumen manejable. Una consulta por pais daria mas de mil
# entradas por corrida, y cada item que sobrevive a la deduplicacion cuesta
# una llamada al modelo.
#
# DECISION 2026-07-31: se descartan las fuentes normativas primarias.
# No existen feeds utilizables (ver bloque `descartadas`) y el cambio
# normativo se detecta igual via cobertura periodistica: el DNU migratorio
# argentino aparecio en los feeds el mismo dia de su publicacion.
#
# Las URLs marcadas `verificado: false` son CANDIDATAS. Correr antes:
#     python scripts/validar_fuentes.py
#     python scripts/descubrir_feeds.py
#     python scripts/muestrear_feeds.py
#
# prioridad: 1 = arranque   2 = segunda tanda   3 = evaluar / de baja

alcance:
  descripcion: America Latina y el Caribe + Estados Unidos
  idiomas:
  - es
  - pt
  - en
  nota: El clasificador opera en los tres idiomas y devuelve siempre en castellano. Los titulos se conservan
    en su idioma original.
medios_google_news:
- id: gnews_cono_sur_normativa
  bloque: cono_sur
  region: Cono Sur
  query: ("politica migratoria" OR decreto OR ley OR resolucion OR visa OR asilo migrantes) (Argentina
    OR Chile OR Uruguay OR Paraguay) when:3d
  gl: AR
  hl: es-419
  pais: &id001
  - AR
  - CL
  - UY
  - PY
  eje_esperado: normativa
  prioridad: 1
  verificado: true
- id: gnews_cono_sur_derechos
  bloque: cono_sur
  region: Cono Sur
  query: (deportacion OR expulsion OR detencion OR "derechos de los migrantes" OR refugiados) (Argentina
    OR Chile OR Uruguay OR Paraguay) when:3d
  gl: AR
  hl: es-419
  pais: *id001
  eje_esperado: derechos
  prioridad: 1
  verificado: true
- id: gnews_cono_sur_odio
