  alcance: Mujeres migrantes, violencia de genero
- id: lgbtiq
  alcance: Personas LGBTIQ+, migracion por orientacion o identidad
- id: indigenas
  alcance: Pueblos indigenas en movilidad
- id: afro
  alcance: Personas afrodescendientes
- id: personas_mayores
  alcance: Personas adultas mayores
- id: discapacidad
  alcance: Personas con discapacidad
- id: trabajadoras_hogar
  alcance: Trabajo domestico y de cuidados
- id: refugiados
  alcance: Solicitantes de asilo y personas refugiadas
- id: retornados
  alcance: Personas retornadas o deportadas
