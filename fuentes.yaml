notas_vocabulario:
  version: 3.1 (2026-08-02)
  ejes: '24 ejes en 5 macroareas. Los SUBEJES no son salida del clasificador: son el vocabulario que
    define el alcance de cada eje dentro del prompt.'
  poblaciones: 13 valores, solo condicion de VULNERABILIDAD. La condicion juridica (solicitante de asilo,
    refugiada, apatrida, deportada) la cubren los ejes `asilo`, `estatus` y `deportaciones`. Tenerla
    en las dos dimensiones obligaba al clasificador a decidir dos veces lo mismo.
  colectividades: 'Codigos ISO del pais de origen de la comunidad involucrada. Distinta de `poblaciones`:
    es origen nacional, no vulnerabilidad.'
  etapas: Seleccion unica. En que momento del recorrido ocurre el hecho.
  fuera_del_clasificador: 'FORMATOS (noticia, cronica, perfil, podcast) describe lo que Refugio PRODUCE,
    no lo que el radar detecta: desde un titular ajeno no es determinable ni cambia la decision de cubrir.
    ENFOQUES TRANSVERSALES se solapaba con `poblaciones` (ninez_y_adolescencia / ninez, perspectiva_de_genero
    / mujeres). ESCALAS (barrial a internacional) es util y determinable, pero cada dimension extra
    degrada la precision de todas: queda para evaluar mas adelante.'
  desambiguacion:
    biometria: En control fronterizo -> `fronteras`. Como debate tecnologico -> `tecnologia`.
    detencion: TODA detencion de personas migrantes -> `deportaciones`, sea en frontera, en centro de
      detencion o en redada interior.
    desplazamiento: Por persecucion politica -> `exilio`. Por clima -> `movilidad_ambiental`.
    retorno: Voluntario -> `diaspora`. Forzado -> `deportaciones`.
    explotacion: Con red criminal -> `trata`. Sin red -> `trabajo`.
    vigilancia: En frontera -> `fronteras`. Politica de Estado -> `securitizacion`. Debate tecnologico
      -> `tecnologia`.
    inmovilidad: Si la persona QUIERE moverse y no puede -> `inmovilidad`. Si esta detenida en proceso
      de expulsion -> `deportaciones`.
    desaparecidos: En ruta migratoria -> `rutas`. Por persecucion politica -> `exilio`.
    control_migratorio: En frontera o paso fronterizo -> `fronteras`. Operativo en via publica, transporte
      o lugar de trabajo, con detencion de personas -> `deportaciones`. Como politica sostenida de vigilancia
      sobre la poblacion migrante -> `securitizacion`. Un mismo operativo puede llevar dos de los tres.
    fiscalizacion: De documentacion migratoria a personas -> `fronteras` o `deportaciones` segun donde
      ocurra. De empleadores que contratan migrantes -> `trabajo`.
  actores: 'Dimension nueva en v3. Unica del YAML de sujetos que no duplicaba nada: ninguna otra dimension
    dice QUIEN esta involucrado.'
  sujetos_no_incorporados: 'El YAML de sujetos (v1.1) tenia ~70 categorias, la mitad ya codificadas
    como eje: migrantes_deportados -> `deportaciones`, solicitantes_de_asilo -> `asilo`, trabajadores_migrantes
    -> `trabajo`, condicion_migratoria -> `estatus`. Pedirlas en dos dimensiones a la vez obliga al
    clasificador a decidir dos veces lo mismo y las respuestas se contradicen. Ademas, distinciones
    como migrantes_circulares vs estacionales vs temporales requieren conocer el regimen laboral, que
    ningun titular menciona. Se absorbieron como subejes los que aportaban vocabulario.'
  filtros_del_tablero: El usuario filtra SOLO por pais y region. Ejes, poblaciones, actores y colectividades
    se muestran como etiquetas en cada titular. Ocho filas de filtros antes de la primera noticia hacian
    que las categorias predominaran visualmente sobre el contenido.
  control_migratorio: 'Agregado el 2026-08-03. ''control migratorio'' y sus variantes no estaban en
    NINGUNA consulta: una nota titulada ''Refuerzan los controles migratorios en la frontera norte''
    solo entraba si ademas decia ''deportacion'' o ''migrantes''.

    Es como la prensa nombra los operativos ANTES de que haya detenciones, asi que perderlo significaba
    llegar tarde.

    PRIORIDAD ARGENTINA: el Cono Sur tiene DOS consultas en prioridad 1; el resto de las regiones, una
    en prioridad 2. El vocabulario cambia por pais: ''reten'' se usa en Mexico y la region andina, ''redada''
    en Estados Unidos, ''operativo'' y ''fiscalizacion'' en el Cono Sur.'
estados:
  _nota: 'Ciclo de vida de un hecho segun su propagacion. La velocidad se mide en MEDIOS DISTINTOS en
    24h, no en cantidad de notas. Umbrales provisorios: hay que calibrarlos con datos reales de las
    primeras semanas.'
  definiciones:
  - id: top_trend
    nombre: Top trend
    orden: 4
    velocidad_min: 20
    accion: No correrla. Cubrir solo con angulo propio o dato nuevo.
  - id: trending
    nombre: Trending
    orden: 3
    velocidad_min: 8
    velocidad_min_acelerando: 5
    aceleracion_min: 4
    accion: Publicar ya, o buscar el angulo que nadie tomo.
  - id: interes
    nombre: De interes
    orden: 2
    velocidad_min: 3
    velocidad_min_acelerando: 2
    aceleracion_min: 2
    accion: 'EL PUNTO JUSTO. Publicar temprano: si escala, la nota ya esta.'
  - id: nadie_lo_mira
    nombre: Nadie lo mira
    orden: 1
    velocidad_max: 2
    importancia_min: 7
    accion: Investigar. Posible primicia. Requiere reporteria propia.
  - id: ruido
    nombre: Ruido
    orden: 0
    velocidad_max: 2
    importancia_max: 6
    accion: Oculto por defecto. Visible con filtro para auditar el descarte.
  alertas:
    _nota: 'La alerta NO se dispara por puntaje alto sino por ASCENSO de estado. El momento que importa
      es cuando algo importante entra en `interes`: ahi todavia se puede llegar primero.'
    disparar_al_ascender_a:
    - interes
    - trending
    importancia_minima: 7
    max_por_corrida: 3
    no_repetir: Un hecho alerta una sola vez por estado. Registro en datos/alertados.json.
