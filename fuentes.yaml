    - fronteras
    - deportaciones
    - securitizacion
    - rutas
  proteccion:
    nombre: Protección y derechos
    pregunta: ¿Qué derechos tienen las personas migrantes y cómo se garantizan?
    ejes:
    - asilo
    - exilio
    - derechos_humanos
    - justicia
    - trata
  integracion:
    nombre: Integración y vida cotidiana
    pregunta: ¿Cómo viven las personas migrantes en las sociedades de destino?
    ejes:
    - estatus
    - acceso_derechos
    - trabajo
    - servicios
  narrativas:
    nombre: Narrativas e interculturalidad
    pregunta: ¿Cómo se representa y debate la migración en la sociedad?
    ejes:
    - odio
    - medios
    - interculturalidad
    - comunidad
  sociedad:
    nombre: Sociedad, cultura y futuro
    pregunta: ¿Cómo transforman las migraciones nuestras sociedades?
    ejes:
    - cultura
    - memoria
    - movilidad_ambiental
    - tecnologia
    - diaspora
