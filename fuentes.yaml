# Registro de fuentes del radar migratorio
#
# ALCANCE: America Latina y el Caribe + Estados Unidos.
#
# DOS CAPAS QUE NO HAY QUE CONFUNDIR:
#   1. BUSQUEDA  -> este archivo. Define QUE ENTRA al sistema.
#   2. CLASIFICACION -> prompts/clasificacion.md. Define COMO SE ETIQUETA
#      lo que ya entro. Ejes, poblaciones y etapas son el vocabulario del
#      clasificador; NO son terminos de busqueda.
#
# REGLA DE ORO PARA LAS CONSULTAS (aprendida a golpes el 2026-07-31):
#
#   ESTRUCTURA OBLIGATORIA:  (A OR B OR C) calificador ancla when:1d
#
#   1. LARGO. Mas de ~120 caracteres y Google ignora `when:`: devuelve 100
#      entradas de hasta 15 anios de antiguedad. Si una consulta devuelve
#      exactamente 100 entradas, sospechar.
#
#   2. PARENTESIS. Los terminos se combinan con AND por defecto; el OR solo
#      aplica a los dos que separa. Sin parentesis,
#         xenofobia OR "discurso de odio" migrantes
#      se lee como: xenofobia, O BIEN (discurso de odio Y migrantes).
#      Por eso entraba cualquier nota con la palabra xenofobia, de Sudafrica
#      o Malasia. El calificador migratorio va AFUERA del grupo.
#
#   3. ANCLA GEOGRAFICA CORTA, 2-3 paises. `gl` sesga la edicion pero NO
#      diferencia resultados: sin ancla, los cuatro bloques regionales
#      devolvian exactamente los mismos titulos.
#
#   4. NUNCA terminos ambiguos sueltos: `visa` trae la tarjeta de credito,
#      `regularizacion` sola trae cooperativas. Siempre calificados.
#
# prioridad: 1 = arranque   2 = segunda tanda   3 = evaluar / de baja

alcance:
  descripcion: America Latina y el Caribe + Estados Unidos
  idiomas:
  - es
  - pt
  - en
  nota: El clasificador opera en los tres idiomas y devuelve siempre en castellano. Los titulos se conservan
    en su idioma original.
