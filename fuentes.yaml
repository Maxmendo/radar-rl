# Registro de fuentes del radar migratorio
#
# ALCANCE: America Latina y el Caribe + Estados Unidos.
# Organizado en bloques subregionales en vez de pais por pais, para mantener
# el volumen manejable.
#
# DOS CAPAS QUE NO HAY QUE CONFUNDIR:
#   1. BUSQUEDA  -> este archivo. Define QUE ENTRA al sistema.
#   2. CLASIFICACION -> prompts/clasificacion.md. Define COMO SE ETIQUETA
#      lo que ya entro. Los ejes, poblaciones y etapas de este archivo son
#      el vocabulario que usa el clasificador; NO son terminos de busqueda.
#
# DECISION 2026-07-31: sin fuentes normativas primarias. No hay feeds
# utilizables (ver `descartadas`) y el cambio normativo se detecta igual via
# cobertura: el DNU migratorio argentino aparecio el mismo dia de publicado.
#
# prioridad: 1 = arranque   2 = segunda tanda   3 = evaluar / de baja

alcance:
  descripcion: America Latina y el Caribe + Estados Unidos
  idiomas:
  - es
  - pt
  - en
  nota: El clasificador opera en los tres idiomas y devuelve siempre en castellano. Los titulos se conservan
    en su idioma original.
