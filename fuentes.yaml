  biblioteca: trendspy
  geo_fijo_audiencia: AR
  max_consultas_por_pais: 3
  alertas_persisten_horas: 12
  _nota_alertas: 'Una alerta se dispara cuando un hecho en `interes` tiene importancia alta y las

    busquedas subiendo. Pero los hechos cambian de estado: el 2026-08-03 la nota del

    ICE en Miami paso de 3 a 8 medios en media hora y la alerta desaparecio del

    tablero. Si nadie miro en esa ventana, se perdio.

    Por eso las alertas persisten 12 horas y quedan marcadas segun lo que paso

    despues: `vigente` si el hecho sigue en `interes`, `escalo` si ya paso a trending

    o top trend, `se_enfrio` si perdio cobertura.'
