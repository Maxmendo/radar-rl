  alcance: Grupos familiares, reunificacion, separacion
etapas:
- id: origen
  alcance: 'Pais de salida: causas, decision de migrar'
- id: transito
  alcance: 'En camino: rutas, corredores, riesgos'
- id: frontera
  alcance: 'En el paso fronterizo: control, rechazo, detencion'
- id: destino
  alcance: Asentamiento, integracion, vida cotidiana
- id: retorno
  alcance: Retorno voluntario o forzado, reintegracion
notas_vocabulario:
  ejes: '14 activos en cuatro familias: politica, proteccion, cotidiano, discurso. Para activar uno
    inactivo, cambiar `activo` a true; no requiere tocar codigo.'
  poblaciones: Multiple. Quien esta afectado. Independiente del eje tematico.
  colectividades: 'Multiple, codigos ISO de pais de origen. No es lista fija: el clasificador la completa
    con la nacionalidad de la comunidad involucrada. Distinta de `poblaciones`: origen nacional, no
    condicion de vulnerabilidad.'
  etapas: Seleccion unica. En que momento del recorrido ocurre el hecho.
  terminologia: 'El sistema NO busca ''migracion ilegal'' como termino: trae demasiado ruido y reproduce
    una categoria que rechazamos. Esa cobertura entra igual por otros terminos, y cuando usa lenguaje
    deshumanizante el clasificador lo registra en `terminologia_problematica`, que alimenta el eje `medios`.'
estados:
  _nota: 'Ciclo de vida de un hecho segun su propagacion. La velocidad se mide en MEDIOS DISTINTOS en
    24h, no en cantidad de notas. Umbrales provisorios: hay que calibrarlos con datos reales de las
    primeras semanas.'
  definiciones:
  - id: top_trend
    nombre: Top trend
    orden: 4
    velocidad_min: 20
    accion: No correrla. Cubrir solo con angulo propio o dato nuevo.
  - id: trending
    nombre: Trending
    orden: 3
    velocidad_min: 8
    velocidad_min_acelerando: 5
    aceleracion_min: 4
    accion: Publicar ya, o buscar el angulo que nadie tomo.
  - id: interes
    nombre: De interes
    orden: 2
    velocidad_min: 3
    velocidad_min_acelerando: 2
    aceleracion_min: 2
    accion: 'EL PUNTO JUSTO. Publicar temprano: si escala, la nota ya esta.'
  - id: nadie_lo_mira
    nombre: Nadie lo mira
    orden: 1
    velocidad_max: 2
    importancia_min: 7
    accion: Investigar. Posible primicia. Requiere reporteria propia.
  - id: ruido
    nombre: Ruido
    orden: 0
    velocidad_max: 2
    importancia_max: 6
    accion: Oculto por defecto. Visible con filtro para auditar el descarte.
  alertas:
    _nota: 'La alerta NO se dispara por puntaje alto sino por ASCENSO de estado. El momento que importa
      es cuando algo importante entra en `interes`: ahi todavia se puede llegar primero.'
    disparar_al_ascender_a:
    - interes
    - trending
    importancia_minima: 7
    max_por_corrida: 3
    no_repetir: Un hecho alerta una sola vez por estado. Registro en datos/alertados.json.
