- id: deportaciones
  nombre: Deportaciones, detención y retornos forzados
  macroarea: gobernanza
  alcance: TODA detención de personas migrantes va acá, sea en frontera, en un centro de detención o
    en una redada en el interior. También las expulsiones y los retornos forzados.
  subejes:
  - expulsiones
  - devoluciones
  - readmisiones
  - retorno_forzado
  - vuelos_de_deportacion
  - separacion_familiar
  - detencion_migratoria
