  - decretos
  - reglamentacion
  - programas
  - acuerdos_bilaterales
  - mercosur
  - integracion_regional
  - organismos_internacionales
  activo: true
- id: fronteras
  nombre: Fronteras
  macroarea: gobernanza
  alcance: Lo que ocurre EN o SOBRE la frontera. La biometría acá es la aplicada al control fronterizo;
    la biometría como debate tecnológico va a `tecnologia`.
  subejes:
  - control_fronterizo
  - pasos_fronterizos
  - externalizacion
  - vigilancia_fronteriza
  - biometria_en_frontera
  - rechazo_en_frontera
