cobertura_agregada:
- id: gdelt_volumen_tema
  modo: timelinevol
  prioridad: 1
  verificado: true
  nota: No es fuente de items. Se consulta por tema ya detectado para medir volumen de cobertura y calcular
    el factor de subcobertura del score.
- id: gdelt_migracion_es
  query: migrantes OR migracion sourcelang:spanish
  modo: artlist
  prioridad: 2
  verificado: true
  nota: 'HTTP 429 en dos corridas consecutivas desde Actions: las IPs de los runners son compartidas
    y llegan con el cupo consumido. Requiere reintento con espera, o ejecutar esta fuente desde una
    IP no compartida.'
tendencias_busqueda:
- id: trends_tramites
  biblioteca: pytrends
  geo: AR
  prioridad: 2
  verificado: false
  nota: pytrends se rompe periodicamente por cambios de Google. Aislar y tolerar fallo.
  terminos:
  - radicacion extranjeros
  - DNI extranjero
  - residencia precaria
  - turno migraciones
  - visa humanitaria
  - reunificacion familiar
  - convalidacion de titulo extranjero
  - asilo
  - regularizacion migratoria
social:
- id: bluesky_migracion
  nombre: Bluesky, busqueda publica
  endpoint: https://public.api.bsky.app/xrpc/app.bsky.feed.searchPosts
  prioridad: 2
  verificado: true
  nota: Endpoint publico sin autenticacion. Volumen bajo en castellano pero limpio.
  terminos:
  - migrantes
  - xenofobia
  - deportacion
  - politica migratoria
  - Darien
- id: youtube_migracion
  nombre: YouTube Data API v3
  prioridad: 3
  verificado: false
  nota: 'Requiere API key con cupo gratuito diario. Valor: detectar discurso y desinformacion en formato
    audiovisual, que es donde mas circula.'
- id: corresponsales
  nombre: Red de corresponsales de Refugio
  prioridad: 1
  verificado: false
  nota: 'NO ES UNA API. Entrada humana: un corresponsal reporta una senal desde su territorio. Es la
    fuente con mayor ventaja comparativa del proyecto y la que ninguna plataforma puede replicar. El
    canal concreto de captura queda por definir; no debe acoplarse a este repositorio.'
