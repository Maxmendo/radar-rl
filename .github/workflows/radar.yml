name: Radar migratorio

# CUÁNDO CORRE
#
# GitHub Actions usa horario UTC, siempre. Argentina es UTC-3.
# Para que corra a las 8:00 de Argentina hay que poner las 11:00 UTC.
# Argentina no cambia de hora, así que este desfase es fijo todo el año.
#
# Formato del cron:  minuto hora dia-del-mes mes dia-de-semana
on:
  schedule:
    - cron: "0 11 * * *"        # todos los días, 08:00 Argentina
  workflow_dispatch:            # habilita el botón "Run workflow" en la web y en la app

# Permite que el workflow escriba de vuelta en el repositorio
permissions:
  contents: write

# Si se dispara una corrida mientras hay otra en curso, cancela la vieja
concurrency:
  group: radar
  cancel-in-progress: true

jobs:
  correr:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Traer el código
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # FASE 1: validación de fuentes y descubrimiento de feeds.
      # `continue-on-error` está en true a propósito: que una fuente esté caída
      # no debe marcar la corrida como fallida ni mandar alertas.
      - name: Validar fuentes
        continue-on-error: true
        run: python scripts/validar_fuentes.py --prioridad 1 | tee datos/validacion.txt

      # scripts/descubrir_feeds.py NO corre a diario: ya no quedan fuentes sin
      # verificar. Se ejecuta a mano cuando se agregan fuentes nuevas al registro.

      - name: Muestrear feeds
        continue-on-error: true
        run: python scripts/muestrear_feeds.py | tee datos/muestra.txt

      # Genera docs/index.html a partir de datos/items.json.
      # Mientras el pipeline de ingesta no exista, usa datos de ejemplo y lo
      # avisa con un cartel en el propio tablero.
      - name: Generar tablero
        run: python scripts/generar_tablero.py

      # FASE 2: descomentar cuando exista el pipeline de ingesta.
      #
      # Este repositorio NO entrega notificaciones ni se integra con ningun bot.
      # Su unica salida son los archivos de datos/. La capa de distribucion
      # (mail, tablero, o lo que se decida) es un proyecto aparte que lee
      # esos archivos. Mantener esa separacion es deliberado.
      #
      # - name: Ingesta y clasificación
      #   env:
      #     GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      #     ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      #   run: python -m nucleo.correr

      # Guarda el resultado en el propio repositorio.
      # Ventaja para esta etapa: es gratis, queda versionado y podés ver la
      # historia de lo que vio el radar cada día con `git log`.
      # El `pull --rebase` evita que la corrida falle si hubo cambios subidos
      # desde otra máquina mientras esta corría.
      - name: Guardar resultados
        run: |
          git config user.name "radar-rl"
          git config user.email "radar@refugiolatinoamericano.com"
          git add datos/ docs/
          git diff --staged --quiet || git commit -m "Radar: corrida $(date -u '+%Y-%m-%d %H:%M') UTC"
          git pull --rebase origin main
          git push

      # Deja los archivos descargables desde la pestaña Actions durante 14 días,
      # por si el commit falla o querés inspeccionar una corrida puntual.
      - name: Adjuntar salida a la corrida
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-${{ github.run_number }}
          path: |
            datos/
            docs/
          retention-days: 14
