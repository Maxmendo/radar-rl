name: Radar migratorio

# CADENCIA
#
# Cada 3 horas, ocho corridas diarias. La frecuencia no es capricho: la
# aceleracion de un tema solo se puede medir comparando corridas. Un feed RSS
# da una foto de que hay, no de que esta creciendo.
#
# GitHub Actions usa horario UTC siempre. Argentina es UTC-3, sin cambio de
# hora, asi que el desfase es fijo todo el anio.
#
# 09:00 UTC = 06:00 Argentina -> es la corrida que ademas genera el digest diario.
#
# Consumo: 8 x 30 x ~2-3 min = 480-720 de los 2.000 minutos gratuitos mensuales.
on:
  schedule:
    - cron: "0 10,16,21 * * *"
  workflow_dispatch:
    inputs:
      forzar_digest:
        description: "Generar el digest diario aunque no sean las 09:00 UTC"
        type: boolean
        default: false
      probar_related:
        description: "Diagnostico: probar si related_queries de Google Trends sirve"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write          # necesario para abrir alertas como issues

concurrency:
  group: radar
  cancel-in-progress: true

jobs:
  correr:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Traer el cÃ³digo
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # Navegador headless para resolver las URLs de Google News (las peticiones
      # HTTP planas reciben captcha; Playwright ejecuta JS y Google no bloquea).
      # --with-deps instala tambien las librerias de sistema que Chromium necesita.
      - name: Instalar navegador Playwright
        run: python -m playwright install --with-deps chromium

      # Â¿Esta corrida genera el digest diario?
      - name: Decidir si toca digest
        id: cuando
        run: |
          hora=$(date -u +%H)
          if [ "$hora" = "09" ] || [ "${{ inputs.forzar_digest }}" = "true" ]; then
            echo "digest=true" >> $GITHUB_OUTPUT
          else
            echo "digest=false" >> $GITHUB_OUTPUT
          fi
          echo "Hora UTC: $hora"

      # ------------------------------------------------------------------
      # MONITOREO. Corre en las ocho corridas.
      # `continue-on-error` a proposito: una fuente caida no es una falla del
      # sistema y no debe disparar notificaciones.
      # ------------------------------------------------------------------
      - name: Validar fuentes
        continue-on-error: true
        run: python scripts/validar_fuentes.py --prioridad 1 | tee datos/validacion.txt

      # INGESTA. Descarga los feeds, agrupa las notas del mismo hecho y calcula
      # velocidad (medios distintos por hecho). Todavia sin clasificacion por LLM.
      - name: Ingesta
        run: python -m nucleo.ingesta --prioridad 1

      # CLASIFICACION. Solo los hechos nuevos y dentro del alcance, en lotes de
      # 20. `continue-on-error` a proposito: si la API falla o se agota el cupo,
      # el radar sigue funcionando sin clasificacion y reintenta en la proxima.
      # El prompt se genera desde fuentes.yaml, no se edita a mano: asi el
      # vocabulario del clasificador y el registro no pueden desincronizarse.
      - name: Generar prompt
        run: python scripts/generar_prompt.py

      - name: Clasificar
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m nucleo.clasificar --lote 20 --max-hechos 120

      # GOOGLE TRENDS. Va DESPUES de clasificar porque necesita el
      # `termino_busqueda` de cada hecho y su importancia, que definen cuales
      # estan en estado `interes`.
      #
      # Corre en TODAS las corridas, no solo en el digest: son ~4 consultas cada
      # vez en vez de ~60 de una sola vez. Concentrarlas agoto la cuota de Google
      # en el sexto pedido el 2026-08-03. Los paises rotan entre corridas.
      - name: Google Trends
        continue-on-error: true
        run: python -m nucleo.tendencias

      # DIAGNOSTICO PUNTUAL. No corre nunca solo: hay que tildarlo al disparar
      # la corrida a mano. Prueba si `related_queries` puede vincular Google
      # Trends con hechos individuales, que es lo que fallo dos veces con
      # `interest_over_time`. Escribe datos/prueba_related.txt
      - name: Probar related_queries
        if: inputs.probar_related == true
        continue-on-error: true
        run: python scripts/probar_related.py

      # Descubre el feed de las fuentes marcadas `verificado: false` en el
      # registro. Si no quedan candidatos, avisa y termina en un segundo.
      - name: Descubrir feeds
        if: steps.cuando.outputs.digest == 'true'
        continue-on-error: true
        run: python scripts/descubrir_feeds.py | tee datos/feeds.txt

      # Diagnostico, solo en la corrida del digest para no gastar tiempo.
      - name: Muestrear feeds
        if: steps.cuando.outputs.digest == 'true'
        continue-on-error: true
        run: python scripts/muestrear_feeds.py | tee datos/muestra.txt

      # ------------------------------------------------------------------
      # FASE 2 â€” descomentar a medida que exista cada modulo.
      # Orden de construccion: ingesta -> deduplicacion -> memoria y velocidad
      # -> clasificacion -> tablero real -> alertas.
      #
      # Este repositorio NO notifica por Telegram ni se integra con ningun bot.
      # Su unica salida son los archivos de datos/ y docs/.
      # ------------------------------------------------------------------
      #
      # - name: Ingesta y deduplicaciÃ³n
      #   run: python -m nucleo.correr --ingesta
      #
      # - name: Velocidad y aceleraciÃ³n
      #   run: python -m nucleo.velocidad
      #
      # - name: ClasificaciÃ³n
      #   env:
      #     GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      #     ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      #   run: python -m nucleo.clasificar
      #
      # Alertas: abre un issue cuando un hecho supera el umbral. GitHub notifica
      # por mail y por push a la app del celular, sin credenciales externas.
      # Maximo 3 por corrida; los ya alertados quedan en datos/alertados.json.
      # - name: Alertas
      #   env:
      #     GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #   run: python -m nucleo.alertar --umbral 40 --max 3

      # Escribe docs/index.html. La carpeta docs/ es la raiz del sitio en
      # Cloudflare Pages: cada push la redespliega automaticamente. Ahi viven
      # tambien _headers y robots.txt, que no se regeneran.
      # ALERTAS. Abre un issue cuando un hecho importante y poco cubierto tiene
      # las busquedas subiendo. GitHub notifica por mail y por push al celular,
      # sin credenciales externas. Cada alerta se avisa UNA sola vez: el registro
      # esta en datos/alertados.json
      - name: Alertas editoriales
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CORREO_USUARIO: ${{ secrets.CORREO_USUARIO }}
          CORREO_CLAVE: ${{ secrets.CORREO_CLAVE }}
        run: python -m nucleo.alertar

      # ENRIQUECER FUENTES. Baja el texto de las 3 fuentes principales de los
      # hechos que califican para borrador Y de los que estan en alerta editorial
      # (pocos por corrida). Va DESPUES de Trends y Alertas para que los hechos en
      # alerta ya existan y su texto quede listo. Sin esto el borrador se redacta
      # solo con el titular. Tolera fallos: las fuentes que no bajen quedan sin
      # texto y el borrador lo marca. Debe ir ANTES de Generar tablero, que copia
      # el texto a docs/items.json para que lo lea el Worker.
      - name: Enriquecer fuentes
        continue-on-error: true
        run: python scripts/enriquecer_fuentes.py

      - name: Generar tablero
        run: python scripts/generar_tablero.py

      # Guarda el resultado en el propio repositorio: gratis, versionado, y
      # deja ver con `git log` la historia de lo que vio el radar.
      # El `pull --rebase` evita fallar si hubo cambios subidos mientras corria.
      - name: Guardar resultados
        run: |
          git config user.name "radar-rl"
          git config user.email "radar@refugiolatinoamericano.com"

          # `prompts/` va incluido a proposito: el paso "Generar prompt" lo
          # reescribe en cada corrida. Si queda fuera del commit, el archivo
          # aparece como cambio sin agregar y `pull --rebase` se niega a
          # trabajar. Fue la causa del fallo del 2026-08-02.
          git add datos/ docs/ prompts/

          git diff --staged --quiet || git commit -m "Radar: corrida $(date -u '+%Y-%m-%d %H:%M') UTC"

          # Reintentos: con ocho corridas diarias mas commits manuales, el push
          # puede rebotar si alguien subio algo mientras esta corria.
          for i in 1 2 3; do
            # Si el rebase entra en conflicto (tipico en docs/index.html porque
            # es un archivo generado), no intentamos mezclar: regeneramos el HTML
            # desde la plantilla, que es la unica fuente de verdad. Asi los cambios
            # de las fuentes (.py) subidos por fuera del radar nunca se pierden.
            if git pull --rebase origin main; then
              git push && exit 0
            else
              echo "conflicto en rebase, regenerando index.html desde la plantilla"
              git checkout --theirs -- docs/index.html 2>/dev/null || true
              git add docs/index.html 2>/dev/null || true
              git rebase --continue 2>/dev/null || git rebase --abort
              python scripts/generar_tablero.py
              git add docs/
              git commit -m "Radar: regenera index tras conflicto" 2>/dev/null || true
              git push && exit 0
            fi
            echo "push rechazado, reintento $i/3"
            sleep 5
          done
          echo "No se pudo guardar despues de 3 intentos"
          exit 1

      # Solo en la corrida del digest: adjuntar es util para inspeccionar,
      # pero hacerlo ocho veces por dia llena la pestana de artifacts.
      - name: Adjuntar salida a la corrida
        if: always() && steps.cuando.outputs.digest == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: radar-${{ github.run_number }}
          path: |
            datos/
            docs/
          retention-days: 14
