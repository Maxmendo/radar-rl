name: Radar migratorio

# CADENCIA
#
# Cada 3 horas, ocho corridas diarias. La frecuencia no es capricho: la
# aceleracion de un tema solo se puede medir comparando corridas. Un feed RSS
# da una foto de que hay, no de que esta creciendo.
#
# GitHub Actions usa horario UTC siempre. Argentina es UTC-3, sin cambio de
# hora, asi que el desfase es fijo todo el anio.
#
# 09:00 UTC = 06:00 Argentina -> es la corrida que ademas genera el digest diario.
#
# Consumo: 8 x 30 x ~2-3 min = 480-720 de los 2.000 minutos gratuitos mensuales.
on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      forzar_digest:
        description: "Generar el digest diario aunque no sean las 09:00 UTC"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write          # necesario para abrir alertas como issues

concurrency:
  group: radar
  cancel-in-progress: true

jobs:
  correr:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Traer el código
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # ¿Esta corrida genera el digest diario?
      - name: Decidir si toca digest
        id: cuando
        run: |
          hora=$(date -u +%H)
          if [ "$hora" = "09" ] || [ "${{ inputs.forzar_digest }}" = "true" ]; then
            echo "digest=true" >> $GITHUB_OUTPUT
          else
            echo "digest=false" >> $GITHUB_OUTPUT
          fi
          echo "Hora UTC: $hora"

      # ------------------------------------------------------------------
      # MONITOREO. Corre en las ocho corridas.
      # `continue-on-error` a proposito: una fuente caida no es una falla del
      # sistema y no debe disparar notificaciones.
      # ------------------------------------------------------------------
      - name: Validar fuentes
        continue-on-error: true
        run: python scripts/validar_fuentes.py --prioridad 1 | tee datos/validacion.txt

      # INGESTA. Descarga los feeds, agrupa las notas del mismo hecho y calcula
      # velocidad (medios distintos por hecho). Todavia sin clasificacion por LLM.
      - name: Ingesta
        run: python -m nucleo.ingesta --prioridad 1

      # CLASIFICACION. Solo los hechos nuevos y dentro del alcance, en lotes de
      # 20. `continue-on-error` a proposito: si la API falla o se agota el cupo,
      # el radar sigue funcionando sin clasificacion y reintenta en la proxima.
      # El prompt se genera desde fuentes.yaml, no se edita a mano: asi el
      # vocabulario del clasificador y el registro no pueden desincronizarse.
      - name: Generar prompt
        run: python scripts/generar_prompt.py

      - name: Clasificar
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m nucleo.clasificar --lote 20 --max-hechos 120

      # Diagnostico, solo en la corrida del digest para no gastar tiempo.
      - name: Muestrear feeds
        if: steps.cuando.outputs.digest == 'true'
        continue-on-error: true
        run: python scripts/muestrear_feeds.py | tee datos/muestra.txt

      # ------------------------------------------------------------------
      # FASE 2 — descomentar a medida que exista cada modulo.
      # Orden de construccion: ingesta -> deduplicacion -> memoria y velocidad
      # -> clasificacion -> tablero real -> alertas.
      #
      # Este repositorio NO notifica por Telegram ni se integra con ningun bot.
      # Su unica salida son los archivos de datos/ y docs/.
      # ------------------------------------------------------------------
      #
      # - name: Ingesta y deduplicación
      #   run: python -m nucleo.correr --ingesta
      #
      # - name: Velocidad y aceleración
      #   run: python -m nucleo.velocidad
      #
      # - name: Clasificación
      #   env:
      #     GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      #     ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      #   run: python -m nucleo.clasificar
      #
      # Alertas: abre un issue cuando un hecho supera el umbral. GitHub notifica
      # por mail y por push a la app del celular, sin credenciales externas.
      # Maximo 3 por corrida; los ya alertados quedan en datos/alertados.json.
      # - name: Alertas
      #   env:
      #     GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #   run: python -m nucleo.alertar --umbral 40 --max 3

      - name: Generar tablero
        run: python scripts/generar_tablero.py

      # Guarda el resultado en el propio repositorio: gratis, versionado, y
      # deja ver con `git log` la historia de lo que vio el radar.
      # El `pull --rebase` evita fallar si hubo cambios subidos mientras corria.
      - name: Guardar resultados
        run: |
          git config user.name "radar-rl"
          git config user.email "radar@refugiolatinoamericano.com"
          git add datos/ docs/
          git diff --staged --quiet || git commit -m "Radar: corrida $(date -u '+%Y-%m-%d %H:%M') UTC"
          git pull --rebase origin main
          git push

      # Solo en la corrida del digest: adjuntar es util para inspeccionar,
      # pero hacerlo ocho veces por dia llena la pestana de artifacts.
      - name: Adjuntar salida a la corrida
        if: always() && steps.cuando.outputs.digest == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: radar-${{ github.run_number }}
          path: |
            datos/
            docs/
          retention-days: 14
